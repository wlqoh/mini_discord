services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: murad
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murad -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: "123"
    volumes:
      - ./sql/init:/migrations:ro
    command: >
      sh -c "
      psql -h db -U murad -d postgres -v ON_ERROR_STOP=1 -f /migrations/01_users.sql &&
      psql -h db -U murad -d postgres -v ON_ERROR_STOP=1 -f /migrations/02_chat_schema.sql &&
      psql -h db -U murad -d postgres -v ON_ERROR_STOP=1 -f /migrations/03_users_avatar_key.sql &&
      psql -h db -U murad -d postgres -v ON_ERROR_STOP=1 -f /migrations/04_message_attachments.sql &&
      psql -h db -U murad -d postgres -v ON_ERROR_STOP=1 -f /migrations/05_users_attachment_folder_key.sql &&
      psql -h db -U murad -d postgres -v ON_ERROR_STOP=1 -f /migrations/06_users_nickname.sql &&
      psql -h db -U murad -d postgres -v ON_ERROR_STOP=1 -f /migrations/07_messages_reply_to.sql &&
      psql -h db -U murad -d postgres -v ON_ERROR_STOP=1 -f /migrations/08_users_soft_delete.sql &&
      psql -h db -U murad -d postgres -v ON_ERROR_STOP=1 -f /migrations/09_users_email_verification.sql &&
      psql -h db -U murad -d postgres -v ON_ERROR_STOP=1 -f /migrations/10_channel_reads.sql &&
      psql -h db -U murad -d postgres -v ON_ERROR_STOP=1 -f /migrations/11_message_mentions.sql &&
      psql -h db -U murad -d postgres -v ON_ERROR_STOP=1 -f /migrations/12_notification_settings.sql &&
      psql -h db -U murad -d postgres -v ON_ERROR_STOP=1 -f /migrations/13_push_subscriptions.sql &&
      psql -h db -U murad -d postgres -v ON_ERROR_STOP=1 -f /migrations/14_link_previews.sql &&
      psql -h db -U murad -d postgres -v ON_ERROR_STOP=1 -f /migrations/15_messages_search.sql
      "

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CONFIG_PATH: ./config/prod.yaml
      # Backs GET /api/v1/webrtc/turn-credentials (short-lived, per-user TURN
      # creds). TURN_STATIC_AUTH_SECRET must match coturn's static-auth-secret
      # (with use-auth-secret enabled) — without it, the endpoint 404s and the
      # frontend silently falls back to STUN-only, which fails for anyone
      # behind a symmetric NAT/CGNAT.
      TURN_URLS: ${TURN_URLS:-turn:45.155.205.212:3478?transport=udp,turn:45.155.205.212:3478?transport=tcp,turn:45.155.205.212:5349?transport=udp,turn:45.155.205.212:5349?transport=tcp}
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_WEBRTC_STUN_URLS: ${VITE_WEBRTC_STUN_URLS:-stun:stun.l.google.com:19302}
        VITE_WEBRTC_TURN_URLS: ${VITE_WEBRTC_TURN_URLS:-turn:45.155.205.212:3478?transport=udp,turn:45.155.205.212:3478?transport=tcp,turn:45.155.205.212:5349?transport=udp,turn:45.155.205.212:5349?transport=tcp}
        # Deliberately no default username/credential here: leaving both
        # unset makes the frontend call GET /webrtc/turn-credentials for
        # short-lived, per-user creds instead (see backend.environment above).
        # Set these explicitly only to force the old static-credential mode.
        VITE_WEBRTC_TURN_USERNAME: ${VITE_WEBRTC_TURN_USERNAME:-}
        VITE_WEBRTC_TURN_CREDENTIAL: ${VITE_WEBRTC_TURN_CREDENTIAL:-}
        VITE_WEBRTC_FORCE_RELAY: ${VITE_WEBRTC_FORCE_RELAY:-false}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8081:80"

volumes:
  pgdata:
